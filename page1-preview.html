<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hugh-Bear — Page 1</title><style>body{margin:0;background:#101b25;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100dvh}.book{width:min(100vw,530px);height:100dvh;max-height:950px;position:relative;overflow:hidden;background:linear-gradient(#20452c,#17281d)}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#071c1be8)}.caption{position:absolute;bottom:85px;left:20px;right:20px;text-align:center;font-size:clamp(20px,4.5vw,27px);line-height:1.4;text-shadow:0 2px 9px black;min-height:120px}.controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:12px}button{border:0;border-radius:24px;padding:13px 18px;background:#f3c965;color:#17261d;font-weight:700}small{position:absolute;top:12px;right:12px;background:#0008;padding:6px 10px;border-radius:12px}</style><div class="book"><img class="art" src="assets/images/page01.jpg" alt="Hugh-Bear and Bryson in a magical woodland"><div class="shade"></div><small>Page 1 of 26</small><div class="caption" id="caption">The Adventures of Hugh-Bear</div><div class="controls"><button id="play">▶ Start story</button><button id="replay">↻ Replay</button></div></div><audio id="voice" src="assets/audio/page01_beth.mp3" preload="auto"></audio><audio id="music" src="assets/audio/page01_music.wav" loop preload="auto"></audio><script>const phrases=["Once upon a time,","there was a little boy called Hugh-Bear,","and his very best furry friend, Bryson.","Together, they were about to have","the most wonderful adventure!"];let timers=[];function start(){timers.forEach(clearTimeout);const v=document.getElementById('voice'),m=document.getElementById('music'),c=document.getElementById('caption');v.currentTime=0;m.currentTime=0;m.volume=.16;Promise.allSettled([v.play()
